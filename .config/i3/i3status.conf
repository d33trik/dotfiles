general {
	interval = 5
	colors = true
	color_good="#c8d3f5"
	color_degraded="#ffc777"
	color_bad="#ff757f"
}

order += "cpu_usage"
order += "memory"
order += "disk /"
order += "wireless _first_"
order += "ethernet _first_"
order += "tztime local"

cpu_usage {
	format = "  %usage"
	degraded_threshold = "85"
	max_threshold = "90"
}

memory {
	format = "  %percentage_used"
	threshold_degraded = "15%"
	threshold_critical = "10%"
}

disk "/" {
	format = "󰋊 %percentage_used"
	threshold_type = "percentage_free"
	low_threshold = "10"
}

wireless _first_ {
	format_up = "  %essid (%quality)"
	format_quality = "%02d%s"
	format_down = ""
}

ethernet _first_ {
	format_up = "󰈀  %speed"
	format_down = ""
}

tztime local {
	format = "  %Y-%m-%d %H:%M:%S"
}
